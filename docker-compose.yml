services:
  postgres:
    image: postgres:16-alpine
    container_name: civicfix-postgres
    environment:
      POSTGRES_USER: civicfix
      POSTGRES_PASSWORD: civicfix
      POSTGRES_DB: civicfix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: civicfix-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata:
